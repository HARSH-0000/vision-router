name: LoRA Regression Gate & Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  regression-test:
    name: Verify Zero Catastrophic Forgetting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (CPU Torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run catastrophic forgetting regression tests
        run: |
          pytest -v

  build-image:
    name: Build Production Docker Image
    needs: regression-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: lora-vision-router:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
